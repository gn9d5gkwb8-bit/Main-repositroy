name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versions here must match rokit.toml.
      - name: Install tools
        run: |
          mkdir -p "$HOME/bin" && cd "$HOME/bin"
          curl -sSfL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip
          curl -sSfL -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.27.1/selene-0.27.1-linux.zip
          curl -sSfL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.0.2/stylua-linux-x86_64.zip
          for f in *.zip; do unzip -o -q "$f"; done
          chmod +x rojo selene stylua
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Lint (selene)
        run: selene src

      - name: Format check (StyLua)
        run: stylua --check src

      - name: Build place (Rojo)
        run: rojo build default.project.json -o build/game.rbxl
